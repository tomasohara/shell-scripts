# CodeQL configuration for code scanning (see ../workflows/codeql.yml)
#
# Note:
# - This only takes effect under CodeQL's "advanced setup": the "default setup"
#   enabled via the repo settings ignores configuration files.
# - CodeQL only analyzes Python and Github Actions files here: Bash and Perl
#   are not supported, so most of the repo is skipped regardless.
# - The paths are relative to the repo root and can use globs (e.g., **/backup).
# - The exclusions only apply to code scanning: secret scanning is separate
#   (see .github/secret_scanning.yml in the docs), and test data should still
#   be checked for credentials.
# - Docs: https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/customizing-your-advanced-setup-for-code-scanning
#
## NOTE: Created with assistance from Claude Code (model Claude Fable 5.2).

name: "shell-scripts CodeQL config"

